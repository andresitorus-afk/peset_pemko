version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_LOGIN_HASH=${NUXT_PUBLIC_LOGIN_HASH}
      - NUXT_PUBLIC_REVERB_KEY=${REVERB_APP_KEY}
      - NUXT_PUBLIC_REVERB_HOST=localhost

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - postgres
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    command: sh -c "ln -sf ../storage/app/public public/storage && php artisan serve --host=0.0.0.0 --port=8000"

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  reverb:
    image: peset_pemko-backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - backend
    ports:
      - "8080:8080"
    environment:
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REVERB_HOST=localhost
      - REVERB_PORT=8080
      - REVERB_SCHEME=http

volumes:
  pgdata:
